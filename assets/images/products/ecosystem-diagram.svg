<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background: radial-gradient(circle at center, #0B2545 0%, #061528 70%, #030A14 100%); font-family: 'Space Grotesk', -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38D4EC" />
      <stop offset="100%" stop-color="#0EA5BE" />
    </linearGradient>
    <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#D7263D" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133E72" />
      <stop offset="50%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#061528" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143660" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B2545" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Technical Background Grid -->
  <g opacity="0.15">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18C5E0" stroke-width="0.75" />
    </pattern>
    <rect width="1200" height="680" fill="url(#grid)" />
    <!-- Concentric Target Circles -->
    <circle cx="600" cy="340" r="160" fill="none" stroke="#18C5E0" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="600" cy="340" r="280" fill="none" stroke="#18C5E0" stroke-width="1" stroke-dasharray="2 6" />
    <circle cx="600" cy="340" r="330" fill="none" stroke="#18C5E0" stroke-width="0.5" />
  </g>

  <!-- Connecting Data Buses (Paths) -->
  <!-- 1. Surveillance (Top-Left) -->
  <path id="path-cctv" d="M 280 150 L 460 270 L 530 310" fill="none" stroke="#18C5E0" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7" />
  <!-- 2. Access Control (Top-Right) -->
  <path id="path-access" d="M 920 150 L 740 270 L 670 310" fill="none" stroke="#18C5E0" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7" />
  <!-- 3. Fire & Life Safety (Mid-Left) -->
  <path id="path-fire" d="M 190 340 L 470 340" fill="none" stroke="#D7263D" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.8" />
  <!-- 4. Network & IT (Mid-Right) -->
  <path id="path-network" d="M 1010 340 L 730 340" fill="none" stroke="#18C5E0" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7" />
  <!-- 5. Voice & Evacuation (Bottom-Left) -->
  <path id="path-voice" d="M 280 530 L 460 410 L 530 370" fill="none" stroke="#18C5E0" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7" />
  <!-- 6. Command & Control (Bottom-Right) -->
  <path id="path-command" d="M 920 530 L 740 410 L 670 370" fill="none" stroke="#18C5E0" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.7" />

  <!-- Animated Traveling Data Packets -->
  <!-- Packet 1: Surveillance -> Core -->
  <circle r="5" fill="#38D4EC" filter="url(#cyanGlow)">
    <animateMotion repeatCount="indefinite" dur="3s" path="M 280 150 L 460 270 L 530 310" />
  </circle>
  <!-- Packet 2: Access -> Core -->
  <circle r="5" fill="#38D4EC" filter="url(#cyanGlow)">
    <animateMotion repeatCount="indefinite" dur="2.8s" path="M 920 150 L 740 270 L 670 310" />
  </circle>
  <!-- Packet 3: Fire -> Core (Emergency Red Packet) -->
  <circle r="6" fill="#FF4D6D" filter="url(#cyanGlow)">
    <animateMotion repeatCount="indefinite" dur="2.2s" path="M 190 340 L 470 340" />
  </circle>
  <!-- Packet 4: Network -> Core -->
  <circle r="5" fill="#38D4EC" filter="url(#cyanGlow)">
    <animateMotion repeatCount="indefinite" dur="2.5s" path="M 1010 340 L 730 340" />
  </circle>
  <!-- Packet 5: Voice -> Core -->
  <circle r="5" fill="#38D4EC" filter="url(#cyanGlow)">
    <animateMotion repeatCount="indefinite" dur="3.2s" path="M 280 530 L 460 410 L 530 370" />
  </circle>
  <!-- Packet 6: Command & Control Bidirectional -->
  <circle r="5" fill="#38D4EC" filter="url(#cyanGlow)">
    <animateMotion repeatCount="indefinite" dur="2.6s" path="M 670 370 L 740 410 L 920 530" />
  </circle>

  <!-- ================= CENTRAL INTEGRATION LAYER NODE ================= -->
  <g transform="translate(600, 340)">
    <!-- Outer Pulsing Orbit Ring -->
    <circle r="92" fill="none" stroke="#18C5E0" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="90;105;90" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Outer Hexagonal Shield -->
    <polygon points="0,-85 74,-42 74,42 0,85 -74,42 -74,-42" fill="url(#coreGrad)" stroke="#18C5E0" stroke-width="2.5" filter="url(#cyanGlow)" />
    
    <!-- Inner Accent Border -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="#0B2545" stroke="rgba(24, 197, 224, 0.4)" stroke-width="1.5" />
    
    <!-- Central Icon: Convergence Pulse -->
    <circle r="22" fill="rgba(24, 197, 224, 0.15)" stroke="#38D4EC" stroke-width="2" />
    <path d="M -10 -4 L -3 -4 L 0 -11 L 4 10 L 8 -4 L 14 -4" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Text Labels in Center -->
    <text y="42" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1">TRUSTNEXUS</text>
    <text y="56" text-anchor="middle" fill="#38D4EC" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1.5">INTEGRATION LAYER</text>
  </g>

  <!-- ================= 6 PERIPHERAL CATEGORY NODES ================= -->

  <!-- NODE 1: Surveillance & AI (Top Left) -->
  <g class="category-node" transform="translate(280, 150)">
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="url(#cardGrad)" stroke="#18C5E0" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="-85" cy="0" r="22" fill="#0B2545" stroke="#38D4EC" stroke-width="1.5" />
    <!-- CCTV Icon -->
    <path d="M -94 -4 L -80 -9 L -80 7 L -94 2 Z M -80 -4 L -74 -7 L -74 5 L -80 2" fill="none" stroke="#38D4EC" stroke-width="1.6" />
    <text x="-52" y="-8" fill="#FFFFFF" font-size="14" font-weight="700">Surveillance &amp; AI</text>
    <text x="-52" y="10" fill="#8E9FAA" font-size="10.5">Edge AI • 4K PTZ • Thermal</text>
    <text x="-52" y="25" fill="#38D4EC" font-size="9" font-family="'JetBrains Mono', monospace">VMS CLUSTER ONLINE</text>
  </g>

  <!-- NODE 2: Access Control (Top Right) -->
  <g class="category-node" transform="translate(920, 150)">
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="url(#cardGrad)" stroke="#18C5E0" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="-85" cy="0" r="22" fill="#0B2545" stroke="#38D4EC" stroke-width="1.5" />
    <!-- Access Badge/Turnstile Icon -->
    <rect x="-92" y="-8" width="14" height="18" rx="2" fill="none" stroke="#38D4EC" stroke-width="1.6" />
    <circle cx="-85" cy="-2" r="3" fill="none" stroke="#38D4EC" stroke-width="1.2" />
    <text x="-52" y="-8" fill="#FFFFFF" font-size="14" font-weight="700">Access Control</text>
    <text x="-52" y="10" fill="#8E9FAA" font-size="10.5">Face ID • Speed Gates • BLE</text>
    <text x="-52" y="25" fill="#38D4EC" font-size="9" font-family="'JetBrains Mono', monospace">ZERO-TRUST VERIFIED</text>
  </g>

  <!-- NODE 3: Fire & Life Safety (Mid Left) -->
  <g class="category-node" transform="translate(190, 340)">
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="url(#cardGrad)" stroke="#D7263D" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="-85" cy="0" r="22" fill="#0B2545" stroke="#FF4D6D" stroke-width="1.5" />
    <!-- Fire Flame Icon -->
    <path d="M -85 -10 C -82 -6 -78 -2 -80 3 C -82 7 -88 7 -90 3 C -91 0 -88 -4 -85 -10 Z" fill="none" stroke="#FF4D6D" stroke-width="1.8" />
    <text x="-52" y="-8" fill="#FFFFFF" font-size="14" font-weight="700">Fire &amp; Life Safety</text>
    <text x="-52" y="10" fill="#8E9FAA" font-size="10.5">Addressable • Gas • Interlocks</text>
    <text x="-52" y="25" fill="#FF4D6D" font-size="9" font-family="'JetBrains Mono', monospace">NFPA/NBC STANDBY</text>
  </g>

  <!-- NODE 4: Network & IT (Mid Right) -->
  <g class="category-node" transform="translate(1010, 340)">
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="url(#cardGrad)" stroke="#18C5E0" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="-85" cy="0" r="22" fill="#0B2545" stroke="#38D4EC" stroke-width="1.5" />
    <!-- Rack/Switch Icon -->
    <rect x="-93" y="-8" width="16" height="6" rx="1" fill="none" stroke="#38D4EC" stroke-width="1.5" />
    <rect x="-93" y="2" width="16" height="6" rx="1" fill="none" stroke="#38D4EC" stroke-width="1.5" />
    <text x="-52" y="-8" fill="#FFFFFF" font-size="14" font-weight="700">Network &amp; IT Infra</text>
    <text x="-52" y="10" fill="#8E9FAA" font-size="10.5">Cat6A/Cat7 • L2/L3 • Fibre</text>
    <text x="-52" y="25" fill="#38D4EC" font-size="9" font-family="'JetBrains Mono', monospace">10Gbps BACKBONE</text>
  </g>

  <!-- NODE 5: Voice & Evacuation (Bottom Left) -->
  <g class="category-node" transform="translate(280, 530)">
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="url(#cardGrad)" stroke="#18C5E0" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="-85" cy="0" r="22" fill="#0B2545" stroke="#38D4EC" stroke-width="1.5" />
    <!-- Speaker / PA Icon -->
    <path d="M -92 -4 L -87 -4 L -82 -9 L -82 9 L -87 4 L -92 4 Z M -78 -3 C -76 -1 -76 1 -78 3" fill="none" stroke="#38D4EC" stroke-width="1.6" />
    <text x="-52" y="-8" fill="#FFFFFF" font-size="14" font-weight="700">Voice &amp; Evacuation</text>
    <text x="-52" y="10" fill="#8E9FAA" font-size="10.5">Multi-Zone PA • Paging • DSP</text>
    <text x="-52" y="25" fill="#38D4EC" font-size="9" font-family="'JetBrains Mono', monospace">EN 54 CERTIFIED BUS</text>
  </g>

  <!-- NODE 6: Command & Control (Bottom Right) -->
  <g class="category-node" transform="translate(920, 530)">
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="url(#cardGrad)" stroke="#18C5E0" stroke-width="1.5" filter="url(#softGlow)" />
    <circle cx="-85" cy="0" r="22" fill="#0B2545" stroke="#38D4EC" stroke-width="1.5" />
    <!-- Console/Display Icon -->
    <rect x="-93" y="-7" width="16" height="11" rx="1" fill="none" stroke="#38D4EC" stroke-width="1.5" />
    <line x1="-89" y1="7" x2="-81" y2="7" stroke="#38D4EC" stroke-width="1.5" />
    <text x="-52" y="-8" fill="#FFFFFF" font-size="14" font-weight="700">Command &amp; Control</text>
    <text x="-52" y="10" fill="#8E9FAA" font-size="10.5">PSIM • BMS Integration • Wall</text>
    <text x="-52" y="25" fill="#38D4EC" font-size="9" font-family="'JetBrains Mono', monospace">SINGLE-PANE TELEMETRY</text>
  </g>

  <!-- Technical Telemetry Legend Bottom Bar -->
  <g transform="translate(600, 645)">
    <rect x="-320" y="-18" width="640" height="36" rx="4" fill="#061528" stroke="rgba(24, 197, 224, 0.3)" stroke-width="1" />
    <circle cx="-290" cy="0" r="4" fill="#38D4EC" />
    <text x="-275" y="4" fill="#8E9FAA" font-size="11">Bidirectional Real-Time Telemetry</text>
    
    <circle cx="-60" cy="0" r="4" fill="#FF4D6D" />
    <text x="-45" y="4" fill="#8E9FAA" font-size="11">Automated Life-Safety Priority Override</text>
    
    <circle cx="180" cy="0" r="4" fill="#10B981" />
    <text x="195" y="4" fill="#8E9FAA" font-size="11">AMC 2.0 Predictive Health Bus</text>
  </g>
</svg>
